name: CI

on:
  pull_request:
    branches: ["*"]
  # main was never actually guarded. Every green run in this repo's history is
  # a pull_request or a tag build, so a commit that reached main directly —
  # which is how this repo is usually worked — ran no checks at all. A push
  # here is the last point where a break is cheap to find.
  push:
    branches: ["main"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      # Both halves are empty on a `push`, and an empty `repository`/`ref` is
      # not an error — checkout quietly falls back to this repo at the pushed
      # commit, which is exactly right there. They are still named because a
      # `pull_request` checks out the MERGE commit by default, and a fork's PR
      # would otherwise resolve to the base repository: the head repo and sha
      # are what actually gets reviewed.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      # `next build` is a distinct class of check from everything above it,
      # and until now nothing in CI ran it. Lint, typecheck, tests and
      # db:check all passed on a tree whose production build died outright —
      # a synchronous export from a `"use server"` module, and a module-scope
      # `path.join(import.meta.dirname, ...)` that is `undefined` once
      # Turbopack bundles the module. Neither is visible to `tsc`: both are
      # build-time contracts, not type errors. A green `pnpm run ci` has to
      # imply an app that actually builds, so the build runs here.
      #
      # Deliberately `next build` and not `pnpm build` — the same choice, for
      # the same reason, that release.yml makes. `pnpm --dir apps/web build`
      # is `db:migrate:apply && next build`, and that first half needs a real,
      # reachable Postgres: building against a database *is* a write to it,
      # because migrations run. A CI runner has no database and must never
      # need one.
      #
      # POSTGRES_URL is set anyway, and is deliberately unreachable. Nothing
      # in the build connects to it; `next.config.ts` copies it into
      # WORKFLOW_POSTGRES_URL while the config is evaluated, and the Workflow
      # SDK's own fallback is a `world` database that exists nowhere. Giving
      # it a syntactically valid URL keeps the build deterministic and keeps
      # that fallback's noise out of the log. Locally `pnpm run ci` picks up
      # apps/web/.env instead, which is why the script itself sets no env.
      - name: Build
        run: pnpm ci:build
        env:
          POSTGRES_URL: postgres://paco:paco@127.0.0.1:5432/paco

      # Built here, not pulled. The sandbox integration tests exercise the image
      # together with the code that drives it, and those two now have to match:
      # the container runs as the host's uid, which only works on an image built
      # for an arbitrary uid. Pulling the published `:latest` would test the
      # last release's image against this branch's code — and on the commit that
      # changes the Dockerfile, that is guaranteed to be the wrong pairing.
      - name: Build the sandbox image this branch describes
        run: docker build -t paco-sandbox:ci packages/sandbox/docker

      # scripts/paco-password.test.ts and packaging/postinst-nginx.test.ts
      # exercise the real `htpasswd`, because the thing worth testing is the
      # hash nginx will actually read. It is not guaranteed on the runner
      # image, and `paco password` refuses to run without it.
      - name: Install htpasswd
        run: sudo apt-get update && sudo apt-get install -y apache2-utils

      - name: Test
        run: pnpm test:isolated
        env:
          PACO_SANDBOX_IMAGE: paco-sandbox:ci

      - name: DB Check
        run: pnpm --dir apps/web db:check

      # The maintainer scripts are here for the same reason install.sh is:
      # they run on someone else's machine, and a syntax error in postinst
      # fails `apt install paco` after 237 MB has been fetched and unpacked,
      # leaving dpkg half-configured. Nothing else in this repo would catch it
      # — the .deb builds fine, because these are copied in, not executed.
      #
      # build-deb.sh is deliberately absent: it carries an intentional SC2016
      # and it runs in CI, where a break is loud and immediate.
      - name: Shell scripts — syntax and shellcheck
        run: |
          for script in install.sh scripts/paco \
                        packaging/debian/postinst \
                        packaging/debian/prerm \
                        packaging/debian/postrm \
                        packaging/paco-entrypoint.sh \
                        packaging/claude-wrapper.sh; do
            sh -n "$script"
            shellcheck -s sh "$script"
          done
