name: CI

on:
  pull_request:
    branches: ["*"]

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.14"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and format check
        run: pnpm check

      - name: Typecheck
        run: pnpm typecheck

      # Built here, not pulled. The sandbox integration tests exercise the image
      # together with the code that drives it, and those two now have to match:
      # the container runs as the host's uid, which only works on an image built
      # for an arbitrary uid. Pulling the published `:latest` would test the
      # last release's image against this branch's code — and on the commit that
      # changes the Dockerfile, that is guaranteed to be the wrong pairing.
      - name: Build the sandbox image this branch describes
        run: docker build -t paco-sandbox:ci packages/sandbox/docker

      - name: Test
        run: pnpm test:isolated
        env:
          PACO_SANDBOX_IMAGE: paco-sandbox:ci

      - name: DB Check
        run: pnpm --dir apps/web db:check

      - name: Shell scripts — syntax and shellcheck
        run: |
          for script in install.sh scripts/paco; do
            sh -n "$script"
            shellcheck -s sh "$script"
          done
